<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Repo Atlas turns a git history into an animated, explorable map of a codebase. Everything runs in your browser tab." />
    <meta name="referrer" content="no-referrer" />
    <title>Repo Atlas</title>
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        var t = localStorage.getItem('atlas.theme');
        if (t === 'paper' || t === 'night') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
